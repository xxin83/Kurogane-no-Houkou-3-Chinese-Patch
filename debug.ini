[Common]
; Direct3D8 EndScene limiter. Set 0 to disable; valid range is 15-240.
FrameRate=60

; Full Debug DLL switches. These override the corresponding version.json UI settings.
; WSC3DebugUI=0 keeps translation and game patches but disables the Debug UI,
; source tracking, debug text/metric recording, and layout tuning.
WSC3DebugUI=1
WSC3SourceTracking=0
; 0 hides the tuning window; the validated XP layout profile remains active.
WSC3LayoutTuner=0
